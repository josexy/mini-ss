local:
  mixed_addr: :10088
  mitm:
    enable: true
    proxy: http://127.0.0.1:7900
    ca_path: "certs/ca.crt"
    key_path: "certs/ca.key"
    fake_cert_pool:
      capacity: 50
      interval: 30000
      expire_second: 15000
  tun:
    enable: true
    name: ""
    cidr: 198.18.0.1/16
    mtu: 9000
    auto_route: true
    dns_hijack:
      - 8.8.8.8:53 
      - any:53
  dns:
    listen: ':5380'
    disable_rewrite: true
    nameservers:
      - 8.8.8.8
      - 114.114.114.114
log:
  color: true
  log_level: trace
  verbose_level: 1

# iface: lo
auto_detect_iface: true
